name: Automatic News Synchronization

on:
  schedule:
    # Trigger news ingestion every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual news sync trigger'
        required: false
        default: 'Manual news workflow dispatch trigger'

concurrency:
  group: suchnasetu-news-sync
  cancel-in-progress: false

jobs:
  sync-news-feeds:
    name: Sync Live News Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Secure News Sync API Endpoint
        env:
          APP_URL: https://suchnasetu.in
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Sanitize APP_URL (remove trailing slash if present)
          TARGET_URL="${APP_URL:-https://suchnasetu.in}"
          TARGET_URL="${TARGET_URL%/}"
          ENDPOINT="$TARGET_URL/api/cron/sync-news"

          echo "⏰ [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Calling news sync endpoint..."

          # Mask secret token from action logs
          if [ -n "$CRON_SECRET" ]; then
            echo "::add-mask::$CRON_SECRET"
          fi

          RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X GET "$ENDPOINT" \
            -H "User-Agent: SuchnaSetu-GitHubActions-NewsScheduler/1.0" \
            -H "Authorization: Bearer $CRON_SECRET")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ News synchronization request failed with HTTP $HTTP_STATUS"
            echo "Error details: $HTTP_BODY"
            exit 1
          fi

          echo "✅ News synchronization completed successfully."
          echo "Sync Summary:"
          echo "$HTTP_BODY" | jq '.summary // .' 2>/dev/null || echo "$HTTP_BODY"
