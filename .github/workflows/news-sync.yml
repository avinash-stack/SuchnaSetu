name: Automatic News Synchronization

on:
  schedule:
    # Trigger news ingestion every 15 minutes directly on GitHub runner
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual news sync trigger'
        required: false
        default: 'Manual news workflow dispatch trigger'

concurrency:
  group: suchnasetu-news-sync
  cancel-in-progress: false

jobs:
  sync-news-feeds:
    name: Sync Live News Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Standalone News Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://suchnasetu.in
        run: node scripts/run-scheduled-sync.mjs news
