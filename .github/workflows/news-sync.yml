name: Automatic News Synchronization

on:
  schedule:
    # Trigger news ingestion every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual news sync trigger'
        required: false
        default: 'Manual news workflow dispatch trigger'

concurrency:
  group: suchnasetu-news-sync
  cancel-in-progress: false

jobs:
  sync-news-feeds:
    name: Sync Live News Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Batched News Sync API Endpoint
        env:
          APP_URL: https://suchnasetu.in
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATCH_SIZE: "10"
        run: |
          TARGET_URL="${APP_URL:-https://suchnasetu.in}"
          TARGET_URL="${TARGET_URL%/}"
          ENDPOINT="$TARGET_URL/api/cron/sync-news"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Starting batched news sync"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -n "$CRON_SECRET" ]; then
            echo "::add-mask::$CRON_SECRET"
          fi

          BATCH_INDEX=0
          ITERATION=1
          MAX_ITERATIONS=10  # 38 sources / 10 = 4 batches safely
          SYNC_COMPLETE="false"
          HAD_ERRORS="false"
          TOTAL_INSERTED=0
          TOTAL_FETCHED=0
          TOTAL_DUPLICATES=0

          while [ "$SYNC_COMPLETE" != "true" ] && [ $ITERATION -le $MAX_ITERATIONS ]; do
            echo ""
            echo "🔄 News Iteration $ITERATION — batchIndex=$BATCH_INDEX, batchSize=$BATCH_SIZE"

            RESPONSE=$(curl -s -S --max-time 120 -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "$ENDPOINT?batchSize=$BATCH_SIZE&batchIndex=$BATCH_INDEX" \
              -H "Content-Type: application/json" \
              -H "User-Agent: SuchnaSetu-GitHubActions-NewsScheduler/2.0" \
              -H "Authorization: Bearer $CRON_SECRET")

            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

            echo "  HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "  ❌ News batch request failed with HTTP $HTTP_STATUS"
              echo "  Error: $HTTP_BODY"
              HAD_ERRORS="true"
              BATCH_INDEX=$((BATCH_INDEX + 1))
              ITERATION=$((ITERATION + 1))
              sleep 2
              continue
            fi

            IS_COMPLETE=$(echo "$HTTP_BODY" | jq -r '.batchExecution.isComplete // true')
            NEXT_BATCH=$(echo "$HTTP_BODY" | jq -r '.batchExecution.nextBatchIndex // "null"')
            BATCHES_TOTAL=$(echo "$HTTP_BODY" | jq -r '.batchExecution.batchesTotal // "?"')
            INSERTED=$(echo "$HTTP_BODY" | jq -r '.summary.totalArticlesInserted // 0')
            FETCHED=$(echo "$HTTP_BODY" | jq -r '.summary.totalArticlesFetched // 0')
            DUPLICATES=$(echo "$HTTP_BODY" | jq -r '.summary.totalDuplicatesSkipped // 0')

            TOTAL_INSERTED=$((TOTAL_INSERTED + INSERTED))
            TOTAL_FETCHED=$((TOTAL_FETCHED + FETCHED))
            TOTAL_DUPLICATES=$((TOTAL_DUPLICATES + DUPLICATES))

            echo "  ✅ Batch $((BATCH_INDEX + 1))/$BATCHES_TOTAL done | Inserted: +$INSERTED | Fetched: $FETCHED | Skipped: $DUPLICATES"

            if [ "$IS_COMPLETE" = "true" ] || [ "$NEXT_BATCH" = "null" ]; then
              SYNC_COMPLETE="true"
              echo "🎉 News synchronization finished in $ITERATION iteration(s)"
            else
              BATCH_INDEX=$NEXT_BATCH
            fi

            ITERATION=$((ITERATION + 1))
            if [ "$SYNC_COMPLETE" != "true" ]; then
              sleep 2
            fi
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 News Sync Summary:"
          echo "   Total Fetched:    $TOTAL_FETCHED"
          echo "   Total Inserted:   +$TOTAL_INSERTED"
          echo "   Total Duplicates: $TOTAL_DUPLICATES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$HAD_ERRORS" = "true" ]; then
            echo "⚠️  News sync completed but some batches had errors."
            exit 1
          fi

          echo "✅ News synchronization completed successfully."
