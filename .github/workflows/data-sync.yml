name: Automatic Data Synchronization

on:
  schedule:
    # 01:30 AM IST -> 20:00 UTC
    - cron: '0 20 * * *'
    # 08:00 AM IST -> 02:30 UTC
    - cron: '30 2 * * *'
    # 04:00 PM IST -> 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual sync trigger'
        required: false
        default: 'Manual workflow dispatch trigger'

concurrency:
  group: suchnasetu-data-sync
  cancel-in-progress: false

jobs:
  sync-data-sources:
    name: Sync Jobs & Exams (Runner Execution)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Standalone Full Data Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://suchnasetu.in
        run: npx tsx scripts/run-scheduled-sync.ts full
