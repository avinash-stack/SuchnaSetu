name: Automatic Data Synchronization

on:
  schedule:
    # 01:30 AM IST -> 20:00 UTC
    - cron: '0 20 * * *'
    # 08:00 AM IST -> 02:30 UTC
    - cron: '30 2 * * *'
    # 04:00 PM IST (16:00 IST) -> 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Type of synchronization'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - news
          - jobs
          - exams
          - resources
          - source
      source_id:
        description: 'Specific source ID or code (when sync_type is source)'
        required: false
        default: ''
      reason:
        description: 'Reason for manual sync trigger'
        required: false
        default: 'Manual workflow dispatch trigger'

concurrency:
  group: suchnasetu-data-sync
  cancel-in-progress: false

jobs:
  sync-data-sources:
    name: Sync Ingestion Runner (GitHub Actions Execution)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Standalone Sync Runner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE_ADAPTER_TIMEOUT_MS: 12000
          STALE_JOB_THRESHOLD_MS: 2100000
          APP_URL: https://suchnasetu.in
        run: node scripts/run-scheduled-sync.mjs "${{ inputs.sync_type || 'full' }}" "${{ inputs.source_id || '' }}"
